ight:45px;line-height:1.5;background:#17664e;color:#fff;font-size:14px;font-weight:600;text-align:center;padding:11px 12px;margin:12px 0 0}.button.secondary{background:#fff;color:#17664e;border-color:#c8d8cf}.button.tertiary{color:#526173;background:transparent;border-color:transparent;font-weight:400}.button:disabled{background:#edf1f4;color:#8491a0;border-color:#dce2e9}.button.small{font-size:12px;min-height:36px;padding:7px 10px;margin-top:13px}.hint{font-size:11px;line-height:1.8;color:#596777;margin-top:9px}.green-note{color:#36614f}.room-code{font-family:Consolas,monospace;font-size:34px;font-weight:700;letter-spacing:6px;color:#17664e;text-align:center;margin:15px 0 4px}.code-label{font-size:12px;text-align:center;color:#526173}.members-title{display:flex;justify-content:space-between;font-size:14px;font-weight:600;margin-bottom:12px}.members-title span{font-size:12px;font-weight:400;color:#526173}.member{display:flex;align-items:center;gap:10px;min-height:52px;padding:8px 0}.member+.member{border-top:1px solid #edf0f4}.avatar{width:34px;height:34px;border-radius:50%;background:#eaf4ee;color:#17664e;text-align:center;line-height:34px;font-size:13px;font-weight:600}.member-empty .avatar{background:#f1f4f7;color:#8491a0}.member-copy{flex:1}.member-name{font-size:13px;font-weight:600}.member-role{font-size:11px;color:#657487;margin-top:2px}.member-state{font-size:11px;color:#657487}.member-state.done{color:#17664e}.badge{font-size:11px;padding:3px 7px;border-radius:5px;background:#eaf4ee;color:#17664e}.field-label{font-size:14px;font-weight:600;margin-bottom:10px}.code-input{width:100%;height:51px;box-sizing:border-box;border:1px solid #c7d1dc;border-radius:8px;padding:0 12px;background:#fff;font-size:22px;font-weight:600;letter-spacing:5px;color:#192536;outline:none}.code-input::placeholder{font-size:13px;font-weight:400;letter-spacing:0;color:#657487}.input-error{border-color:#ad3529}.error-text{font-size:12px;color:#ad3529;line-height:1.7;margin-top:8px}.center{text-align:center}.count-circle{width:106px;height:106px;border-radius:50%;background:#eaf4ee;color:#17664e;font-size:58px;font-weight:700;line-height:106px;margin:29px auto 24px}.symbol{width:70px;height:70px;border-radius:50%;background:#f0f3f6;color:#526173;font-size:27px;line-height:70px;margin:9px auto 20px;font-weight:600}.symbol.warning{background:#fff3df;color:#876019}.aside{max-width:430px;flex:1;background:#fff;border:1px solid #d5dfe5;border-radius:12px;padding:20px}.aside h2{font-size:17px;margin:0 0 12px}.aside p{font-size:13px;color:#526173;line-height:1.9;margin:8px 0}.demo-tools{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.demo-title{font-size:12px;font-weight:600;color:#526173;margin-top:20px}.demo-message{min-height:40px;font-size:12px;line-height:1.8;color:#785317;padding-top:8px}.columns{display:flex;gap:24px;align-items:start;margin:24px 0}.column{width:387px;flex:none}.column .screen{width:387px}.caption{font-size:15px;font-weight:600;margin-bottom:10px;line-height:1.6}.caption small{font-size:12px;color:#526173;font-weight:400}.footer{margin-top:21px}.overlay{position:absolute;inset:0;background:#102d3670;display:flex;align-items:center;justify-content:center;padding:25px}.dialog{background:#fff;border-radius:13px;padding:21px;width:100%}.dialog h3{font-size:18px;margin:0 0 10px}.dialog p{font-size:13px;line-height:1.8;color:#526173}.summary-mini{font-size:12px;line-height:1.9;color:#526173;background:#f5f7fa;padding:9px 11px;border-radius:7px;margin:12px 0}.sheet .board{width:1281px;max-width:none}.sheet .content{min-height:562px}.sheet .column{min-height:650px}.loading-dots{font-size:25px;color:#17664e;letter-spacing:5px;margin:12px 0}@media(max-width:780px){body:not(.sheet) .board{padding:20px 12px}body:not(.sheet) .layout{flex-direction:column;align-items:center}body:not(.sheet) .screen{max-width:100%}body:not(.sheet) .aside{max-width:100%;width:375px}body:not(.sheet) .head{flex-wrap:wrap}}
</style><main class="board"><header class="head"><div><h1>双人比赛 · 房间流程草图</h1><div class="intro">沿用当前设置页风格，先确认基础按钮、状态和恢复路径。所有房间、成员和参数都是演示数据。</div></div><div class="tag">第一轮草图 · 未接接口</div></header><nav id="state-nav" class="nav-states"></nav><div id="main"><div class="layout"><div class="screen" id="phone"></div><aside class="aside"><h2>当前状态说明</h2><p id="state-description"></p><div class="demo-title">草图演示控制（不是小程序按钮）</div><div class="demo-tools" id="demo-tools"><button data-demo="partner-join">模拟伙伴加入</button><button data-demo="partner-ready">切换伙伴准备</button><button data-demo="role">切换房主／加入者</button><button data-demo="host-start">模拟房主开赛</button><button data-demo="offline">模拟连接失败</button></div><p>加入演示：482731正常；111111房间已满；222222失效；333333连接失败。</p><p>上方状态按钮可直接查看每一张草图。准备、退出确认和倒计时按钮可用于演示流程。</p><div id="demo-message" class="demo-message"></div><div class="line"></div><p>浏览器交互草图，不是微信或真机截图。页面确认后再接房间接口；不代表已实现联机、身份或同步。</p></aside></div></div></main><script>(function client(stateList) {
  const sheet=new URLSearchParams(location.search).get('sheet');
  let current='create',role='host',ownReady=false,partnerReady=false,count=3,roomCode='',inputError='',dialog=false,timer=null,previous='waiting';
  const titles={create:'创建房间',join:'加入房间',waiting:'等待伙伴',ready:'两人准备',both:'双方就绪',countdown:'开始前倒计时',full:'房间已满',expired:'房间已失效',offline:'连接失败',started:'进入答题页'};
  function button(label,action,kind='',disabled=false){return '<button class="button '+kind+'" data-action="'+action+'"'+(disabled?' disabled':'')+'>'+label+'</button>';}
  function settings(){return '<div class="card"><div class="card-title">比赛内容</div><div class="kv"><span class="key">年级</span><span class="value">二年级</span></div><div class="kv"><span class="key">题型</span><span class="value">表内乘法</span></div><div class="kv"><span class="key">题量 / 时长</span><span class="value">20 道 / 120 秒</span></div></div>';}
  function members(state){const waiting=state==='waiting',a=state==='both'||state==='countdown'||(state==='ready'&&ownReady),b=state==='both'||state==='countdown'||(state==='ready'&&partnerReady);return '<div class="card"><div class="members-title">参赛成员<span>'+(waiting?'1 / 2 人':'2 / 2 人')+'</span></div><div class="member"><div class="avatar">我</div><div class="member-copy"><div class="member-name">我</div><div class="member-role">'+(role==='host'?'房主':'加入者')+'</div></div><span class="member-state '+(a?'done':'')+'">'+(waiting?'已加入':a?'✓ 已准备':'未准备')+'</span></div><div class="member '+(waiting?'member-empty':'')+'"><div class="avatar">'+(waiting?'＋':'伴')+'</div><div class="member-copy"><div class="member-name">'+(waiting?'等待另一位伙伴':'伙伴')+'</div><div class="member-role">'+(waiting?'分享房间码邀请加入':'示例参与者')+'</div></div><span class="member-state '+(b?'done':'')+'">'+(waiting?'空位':b?'✓ 已准备':'未准备')+'</span></div></div>';}
  function codeCard(){return '<div class="card"><div class="code-label">房间码 · 示例</div><div class="room-code">482731</div>'+button('复制房间码','copy','secondary small')+'</div>';}
  function body(state){
    let h='';
    if(state==='create')h='<h2 class="title">创建一场小比赛</h2><div class="sub">选好比赛内容，邀请一位伙伴一起参加。</div>'+settings()+button('修改比赛设置','settings','secondary')+button('创建房间','create')+button('输入房间码加入','join','tertiary')+'<div class="hint">同一房间使用相同题目和规则。</div>';
    else if(state==='join')h='<h2 class="title">加入伙伴的房间</h2><div class="sub">输入对方分享的房间码。</div><div class="card"><div class="field-label">房间码</div><input class="code-input '+(inputError?'input-error':'')+'" maxlength="6" inputmode="numeric" value="'+roomCode+'" placeholder="请输入6位数字房间码" aria-label="房间码">'+(inputError?'<div class="error-text">'+inputError+'</div>':'<div class="hint">可以向房主索取房间码。</div>')+'</div>'+button('加入房间','submit-join')+button('我来创建房间','to-create','secondary');
    else if(['waiting','ready','both'].includes(state)){
      const waiting=state==='waiting',both=state==='both'||(ownReady&&partnerReady);
      h='<h2 class="title">'+(waiting?'等一位伙伴加入':both?'准备好就开始吧':'两个人都准备好再开始')+'</h2><div class="sub">'+(waiting?'把房间码发给伙伴，加入后一起准备。':'房间 482731 · 比赛内容由房主设置')+'</div>'+(waiting?codeCard():'')+members(state)+'<div class="summary-mini">二年级 · 表内乘法 · 20 道 · 120 秒</div>';
      if(waiting)h+=button('邀请伙伴','invite')+button('退出房间','exit','secondary');
      else h+=button((state==='both'||ownReady)?'取消准备':'我准备好了','toggle-ready','secondary')+(role==='host'?button('开始比赛','start','',!both):button('等待房主开始','noop','',true))+'<div class="hint center">'+(both?'双方已准备。':'双方准备后，房主才能开始比赛。')+'</div>'+button('退出房间','exit','tertiary');
    } else if(state==='countdown')h='<div class="center"><span class="badge">双方已准备</span><h2 class="title" style="margin-top:15px">比赛马上开始</h2><div class="sub">请准备作答，倒计时结束后进入比赛。</div><div class="count-circle">'+count+'</div><div class="summary-mini">二年级 · 表内乘法<br>20 道题 · 限时 120 秒</div>'+button('取消开始','cancel-start','secondary')+'<div class="hint">倒计时期间请保持在本页。</div></div>';
    else if(state==='full')h='<div class="center"><div class="symbol">2/2</div><h2 class="title">这个房间已经满了</h2><div class="sub">房间只接受两人参赛。<br>请检查房间码，或自己创建新房间。</div></div>'+button('重新输入房间码','join')+button('创建新房间','to-create','secondary');
    else if(state==='expired')h='<div class="center"><div class="symbol warning">!</div><h2 class="title">房间已失效</h2><div class="sub">房间可能已经关闭或过期。<br>请向伙伴索取新的房间码。</div></div>'+button('重新输入房间码','join')+button('创建新房间','to-create','secondary');
    else if(state==='offline')h='<div class="center"><div class="symbol">···</div><h2 class="title">暂时无法连接房间</h2><div class="sub">请检查网络后重试。<br>重试将尝试恢复原房间。</div></div><div class="card"><div class="card-title">保留本次设置</div><div class="hint">房间码和已选比赛内容保持不变。</div></div>'+button('重试连接','retry')+button('返回加入页面','join','secondary');
    else h='<div class="center"><div class="symbol">✓</div><h2 class="title">下一步：比赛答题页</h2><div class="sub">本草图到房间流程为止。<br>这里仅表示进入答题页的跳转位置。</div></div>'+button('返回房间草图','to-create','secondary');
    return '<div class="bar">双人比赛</div><div class="content">'+h+'</div>'+(dialog?'<div class="overlay"><div class="dialog"><h3>'+(role==='host'?'退出并关闭房间？':'退出当前房间？')+'</h3><p>'+(role==='host'?'另一位伙伴将无法继续使用这个房间。':'退出后，你将不再参与本场比赛。')+'</p>'+button('继续留在房间','stay','secondary')+button('确认退出','confirm-exit')+'</div></div>':'');
  }
  function setState(next){if(timer){clearInterval(timer);timer=null;}current=next;dialog=false;inputError='';if(next==='ready'){ownReady=false;partnerReady=false;}if(next==='both'){ownReady=true;partnerReady=true;}if(next==='countdown')count=3;render();}
  function showMessage(value){const element=document.getElementById('demo-message');if(element)element.textContent=value;}
  function render(){
    document.getElementById('phone').innerHTML=body(current);
    document.querySelectorAll('[data-state]').forEach(b=>b.classList.toggle('active',b.dataset.state===current));
    document.getElementById('state-description').textContent={create:'房主可确认比赛设置并创建房间。',join:'加入者输入房间码。草图暂用6位数字，正式格式与接口对齐。',waiting:'房主等待另一人加入；可复制、邀请或退出。',ready:'每个人只能更改自己的准备状态，开始按钮在未全部准备时不可点击。',both:'只有房主显示可用的开始比赛按钮；加入者等待房主开始。',countdown:'双方看到同一倒计时。断线或成员退出时不能按旧状态继续开赛。',full:'房间人数达到上限，返回输入页并保留已输入的房间码。',expired:'房间关闭或过期，提示重新加入或创建。',offline:'保留原房间上下文，重试原连接，避免自动创建重复房间。',started:'仅指明将来答题页面的接入位置，不实现出题。'}[current];
    const input=document.querySelector('#phone input');if(input)input.oninput=e=>{roomCode=e.target.value;};
  }
  const sets={flow:['create','join','waiting'],ready:['ready','both','countdown'],errors:['full','expired','offline']};
  if(sheet){
    document.body.classList.add('sheet');
    document.getElementById('main').innerHTML='<div class="columns">'+sets[sheet].map(state=>{ownReady=state==='both';partnerReady=state==='both';return '<section class="column"><div class="caption">'+stateList.find(s=>s[0]===state)[1]+'<br><small>'+stateList.find(s=>s[0]===state)[2]+'</small></div><div class="screen">'+body(state)+'</div></section>';}).join('')+'</div><div class="footer">草图示例：房间码482731，二年级表内乘法、20道、120秒。仅演示页面状态，不是真实房间或比赛记录。<br>页面保持现有浅灰底、白色面板、深绿色按钮；正式房间接口和规则待组内对齐。本轮没有修改小程序代码。</div>';
    return;
  }
  document.getElementById('state-nav').innerHTML=stateList.map(s=>'<button data-state="'+s[0]+'">'+s[1]+'</button>').join('');
  document.getElementById('state-nav').onclick=e=>{const b=e.target.closest('[data-state]');if(b)setState(b.dataset.state);};
  document.getElementById('phone').onclick=e=>{
    const b=e.target.closest('[data-action]');if(!b||b.disabled)return;
    const action=b.dataset.action;
    if(action==='create'){role='host';setState('waiting');}
    else if(action==='join')setState('join');
    else if(action==='to-create'){role='host';setState('create');}
    else if(action==='submit-join'){
      if(!/^\d{6}$/.test(roomCode)){inputError='请输入6位数字房间码';render();return;}
      role='guest';previous='ready';
      if(roomCode==='111111')setState('full');else if(roomCode==='222222')setState('expired');else if(roomCode==='333333')setState('offline');else{setState('ready');ownReady=false;partnerReady=false;render();}
    }else if(action==='toggle-ready'){ownReady=!(current==='both'||ownReady);if(current==='both'){current='ready';partnerReady=true;}render();}
    else if(action==='start'){
      if(role!=='host'||!(current==='both'||(ownReady&&partnerReady)))return;
      setState('countdown');timer=setInterval(()=>{count--;if(count===0)setState('started');else render();},1000);
    }else if(action==='cancel-start'){setState('ready');ownReady=false;partnerReady=false;render();}
    else if(action==='exit'){dialog=true;render();}
    else if(action==='stay'){dialog=false;render();}
    else if(action==='confirm-exit'){setState('create');showMessage('已演示退出。房主关闭房间后，应通知另一位参与者。');}
    else if(action==='retry'){setState(previous);showMessage('草图模拟恢复成功；正式结果由房间接口决定。');}
    else if(action==='copy')showMessage('复制按钮示意：房间码482731。本草图没有修改剪贴板。');
    else if(action==='invite')showMessage('邀请入口示意：正式版接入微信分享，本草图不会发送消息。');
    else if(action==='settings')showMessage('修改设置入口：正式版复用已有练习设置，房间内参与者看到同一组参数。');
  };
  document.getElementById('demo-tools').onclick=e=>{
    const b=e.target.closest('[data-demo]');if(!b)return;
    if(b.dataset.demo==='partner-join')setState('ready');
    else if(b.dataset.demo==='partner-ready'){if(!['ready','both'].includes(current))setState('ready');partnerReady=!partnerReady;if(current==='both')current='ready';render();}
    else if(b.dataset.demo==='role'){role=role==='host'?'guest':'host';render();showMessage('当前演示身份：'+(role==='host'?'房主':'加入者'));}
    else if(b.dataset.demo==='offline'){previous=['waiting','ready','both'].includes(current)?current:'waiting';setState('offline');}
    else if(b.dataset.demo==='host-start'){ownReady=true;partnerReady=true;setState('countdown');timer=setInterval(()=>{count--;if(count===0)setState('started');else render();},1000);}
  };
  render();
})([["create","01 创建房间","房主确认比赛内容后创建"],["join","02 输入房间码","加入者输入房间码并加入"],["waiting","03 等待另一人","1/2人，邀请或退出"],["ready","04 两人准备","双方分别确认准备"],["both","05 双方就绪","房主可以开始比赛"],["countdown","06 开始前倒计时","双方同时看到3、2、1"],["full","07 房间已满","修改房间码或自行创建"],["expired","08 房间已失效","重新加入或创建新房间"],["offline","09 连接失败","保留设置，重试原房间"]]);</script></html>
