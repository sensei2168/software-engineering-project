name: Project checks
on:
  push:
    branches: [main, 'codex/**', 'feat/**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Business, recovery, page and persistence tests
        run: node --test --test-timeout=15000 tests/*.test.cjs
      - name: Check shared question contract
        run: node scripts/sync-room-contract.cjs --check
